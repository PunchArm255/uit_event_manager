spring.application.name=eventpass

# Save the H2 database to a local file so your data isn't wiped when you restart the app
spring.datasource.url=jdbc:h2:file:./data/eventdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update SQL tables from your Java classes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable the visual SQL database console in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console