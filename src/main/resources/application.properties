spring.application.name=uit-event-manager

# Save the H2 database to a local file with AUTO_SERVER=TRUE so tests and concurrent processes don't lock each other out
spring.datasource.url=jdbc:h2:file:./data/eventdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update SQL tables from your Java classes
spring.jpa.hibernate.ddl-auto=update

# Enable the visual SQL database console in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Include exception messages in REST error responses
server.error.include-message=always
server.error.include-binding-errors=always

# Swagger OpenAPI documentation paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs