<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — UIT EventPass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: #111827; }
        .uit-logo-tint {
            filter: brightness(0) saturate(100%) invert(12%) sepia(83%) saturate(4737%) hue-rotate(216deg) brightness(90%) contrast(105%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-4 py-12 antialiased">

    <div class="w-full max-w-sm">
        <!-- Back link & Logo -->
        <div class="flex flex-col items-center mb-8">
            <a href="/index.html" class="mb-6">
                <img src="/uit-logo.png" alt="UIT" class="h-12 w-auto object-contain uit-logo-tint" onerror="this.style.display='none'">
            </a>
            <h1 id="formTitle" class="text-2xl font-bold text-neutral-900">Connexion</h1>
            <p id="formSubtitle" class="text-sm text-neutral-500 mt-1">Accédez à votre espace Université Ibn Tofaïl</p>
        </div>

        <!-- Clean White Card -->
        <div class="bg-white border border-neutral-200 rounded-2xl p-7 shadow-sm">
            
            <div id="errorBox" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs font-medium"></div>

            <form id="authForm" class="space-y-4">
                <div id="signupFields" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-neutral-700 mb-1.5">Nom complet</label>
                        <input type="text" id="fullName" placeholder="Mohammed Nassiri" class="w-full bg-white border border-neutral-300 rounded-lg px-3.5 py-2.5 text-sm text-neutral-900 focus:outline-none focus:border-[#002B7F]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-neutral-700 mb-1.5">Filière / Code étudiant</label>
                        <input type="text" id="studentId" placeholder="Master GLCC" class="w-full bg-white border border-neutral-300 rounded-lg px-3.5 py-2.5 text-sm text-neutral-900 focus:outline-none focus:border-[#002B7F]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-700 mb-1.5">Adresse email</label>
                    <input type="email" id="email" required value="mohammed.nassiri@uit.ac.ma" class="w-full bg-white border border-neutral-300 rounded-lg px-3.5 py-2.5 text-sm text-neutral-900 focus:outline-none focus:border-[#002B7F]">
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-700 mb-1.5">Mot de passe</label>
                    <input type="password" id="password" required value="student123" class="w-full bg-white border border-neutral-300 rounded-lg px-3.5 py-2.5 text-sm text-neutral-900 focus:outline-none focus:border-[#002B7F]">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-[#002B7F] hover:bg-[#001F5C] text-white font-medium text-sm py-2.5 rounded-lg transition mt-2">
                    Continuer
                </button>
            </form>

            <!-- Toggle Login / Signup -->
            <div class="mt-5 pt-5 border-t border-neutral-100 text-center">
                <button type="button" onclick="toggleMode()" id="toggleBtn" class="text-xs font-medium text-[#002B7F] hover:underline">
                    Pas encore de compte ? Créer un compte étudiant
                </button>
            </div>
        </div>

        <!-- Subtle Demo Quick-Links for Presentation -->
        <div class="mt-6 flex items-center justify-between text-xs text-neutral-400 px-1">
            <span>Comptes démo :</span>
            <div class="space-x-3">
                <button onclick="quickDemo('mohammed.nassiri@uit.ac.ma', 'student123')" class="text-neutral-600 hover:text-[#002B7F] underline">Étudiant</button>
                <button onclick="quickDemo('admin@uit.ac.ma', 'admin123')" class="text-neutral-600 hover:text-[#002B7F] underline">Administrateur</button>
            </div>
        </div>
        <div class="mt-4 text-center">
            <a href="/index.html" class="text-xs text-neutral-400 hover:text-neutral-700">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        let mode = 'login';

        function toggleMode() {
            mode = mode === 'login' ? 'signup' : 'login';
            document.getElementById('signupFields').classList.toggle('hidden', mode === 'login');
            document.getElementById('formTitle').textContent = mode === 'login' ? 'Connexion' : 'Créer un compte';
            document.getElementById('submitBtn').textContent = mode === 'login' ? 'Continuer' : "S'inscrire";
            document.getElementById('toggleBtn').textContent = mode === 'login'
                ? 'Pas encore de compte ? Créer un compte étudiant'
                : 'Déjà inscrit ? Se connecter';
            document.getElementById('errorBox').classList.add('hidden');
        }

        async function quickDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            await loginRequest('/api/auth/login', { email, password });
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const studentId = document.getElementById('studentId').value;

            const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';
            const payload = mode === 'login' ? { email, password } : { fullName, email, password, studentId };
            await loginRequest(endpoint, payload);
        });

        async function loginRequest(endpoint, payload) {
            const errBox = document.getElementById('errorBox');
            errBox.classList.add('hidden');

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                errBox.textContent = "Identifiants incorrects ou email déjà utilisé.";
                errBox.classList.remove('hidden');
                return;
            }

            const user = await res.json();
            localStorage.setItem('uit_user', JSON.stringify(user));
            window.location.href = user.role === 'ADMIN' ? '/admin.html' : '/student.html';
        }
    </script>
</body>
</html>
